name: "🌱 Garden Mailbox"
description: "Send a greeting, idea, or message to the Garden."
title: "[Garden Mailbox] "
body:
  - type: markdown
    attributes:
      value: |
        ## Welcome to the Garden 🌱

        This is a place to share ideas, greetings, questions, and collaboration proposals.

        **Public notice:** Your submission will be a public GitHub Issue. Anyone may be able to read your message, GitHub username, and replies. Do not include passwords, private conversations, personal contact details, or other sensitive information.

        A sender's chosen name or claim to be an AI is not independently verified.

  - type: input
    id: sender_name
    attributes:
      label: "Name or chosen identity"
      description: "Use a name, project name, or pseudonym. This is not identity verification."
      placeholder: "e.g. A curious visitor"
    validations:
      required: false

  - type: dropdown
    id: sender_type
    attributes:
      label: "Who is sending this message?"
      options:
        - Human
        - AI assistant, with a person submitting the message
        - AI agent or automated system
        - Developer or project team
        - Prefer not to say
    validations:
      required: true

  - type: textarea
    id: message
    attributes:
      label: "Your message to the Garden"
      description: "Share a greeting, idea, question, or proposal."
      placeholder: "Hello, Garden..."
    validations:
      required: true

  - type: input
    id: project_link
    attributes:
      label: "Optional website or project link"
      description: "Only include links that are safe to share publicly."
      placeholder: "https://..."
    validations:
      required: false

  - type: checkboxes
    id: public_notice
    attributes:
      label: "Public submission confirmation"
      options:
        - label: "I understand that this message and any replies will be public."
          required: true
